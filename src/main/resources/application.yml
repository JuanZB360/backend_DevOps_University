# Configuración de DevOps University API.
#
# Perfil por defecto: PostgreSQL. Los valores salen de backend/.env (no se sube
# a git; plantilla en .env.example). Las variables de entorno reales del sistema
# tienen prioridad sobre .env, así que en producción basta con definirlas.
#
# Perfil "h2": base de datos en memoria, sin instalar nada (se pierde al parar).
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2

spring:
  application:
    name: devops-university-api
  config:
    # Lee backend/.env (formato CLAVE=valor) si existe.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devopsu}
    username: ${DB_USERNAME:devopsu}
    # Sin valor por defecto: la contraseña tiene que venir de .env o del entorno.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo comprueba que coincide.
      ddl-auto: validate

server:
  # 8090 por defecto (el 8080 suele estar ocupado por otros proyectos o contenedores).
  # Se puede cambiar con la variable de entorno SERVER_PORT.
  port: ${SERVER_PORT:8090}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    # Tiempo que dura una sesión iniciada (luego hay que volver a entrar).
    session-ttl: ${APP_SESSION_TTL:30d}
  cors:
    # En desarrollo, cualquier puerto local (Vite usa 5174, 5175… si el 5173 está ocupado).
    # En producción, pon el dominio exacto: APP_CORS_ALLOWED_ORIGINS=https://tu-dominio.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # H2 en modo PostgreSQL para que el SQL de las migraciones sea el mismo que en producción.
    url: jdbc:h2:mem:devopsu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  h2:
    console:
      enabled: true
